name: Build TalkChinese Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Supabase configuration secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing repository secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing repository secret SUPABASE_ANON_KEY"; exit 1; }
          echo "Supabase configuration secrets are present; values are not displayed."

      - name: Download and validate Chinese-Russian HSK dictionary
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/LiudmilaLV/json_hsk/master/hsk.json \
            --output app/src/main/assets/hsk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("app/src/main/assets/hsk.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if len(data) < 4000:
              raise SystemExit(f"Dictionary looks incomplete: only {len(data)} entries")
          if not all("hanzi" in row and "pinyin" in row and "translations" in row for row in data[:20]):
              raise SystemExit("Dictionary schema validation failed")
          print(f"Validated {len(data)} HSK dictionary entries")
          PY

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle --no-daemon assembleDebug \
            -PSUPABASE_URL="${SUPABASE_URL}" \
            -PSUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkChinese-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
